apiVersion: governance.shcp/v1
kind: GovernanceRuleMap
rules:
  - name: "S3 Server-Side Encryption Enforcement"
    match_contains:
      - "s3-bucket-server-side-encryption-enabled"
      - "server-side-encryption"
    action: "apply_resource_tags"
    params:
      tags:
        GovernanceStatus: "NonCompliant-Encryption"
        RemediationAction: "Enforce-SSE-S3"
    note: "Marca recursos e aciona compliance de criptografia default"
