apiVersion: governance.shcp/v1
kind: GovernanceRuleMap

# Mapa declarativo de governança: para cada controle, o destino já está
# decidido antes do finding aparecer (AUTO, MANUAL ou EXCEPTION).

# OUs que este módulo governa. Por segurança, o padrão são apenas as OUs do
# laboratório (lab_insecure/). Para governar outras OUs, adicione os nomes aqui.
targets:
  ou_names:
    - SCP-Lab
    - SCP-Lab-Exception

# Uma OU com esta tag não é corrigida, mas também não é ignorada: vira
# EXCEPTION no plano, com justificativa (valor da tag) e dono (tag de dono).
# Exceção sem dono volta para MANUAL.
exception:
  tag_key: scp-exception
  owner_tag_key: exception-owner

rules:
  GOV.1:
    title: "Organization com todas as features habilitadas"
    decision: MANUAL
    reason: "Migrar de consolidated billing para all features exige aceite de cada conta-membro"
    mitre: []

  GOV.2:
    title: "Service Control Policies habilitadas na raiz"
    decision: AUTO
    action: enable_policy_type
    params:
      policy_type: SERVICE_CONTROL_POLICY
    mitre: []

  GOV.3:
    title: "SCP baseline anexada (não sair da org, proteger serviços de segurança, bloquear root)"
    decision: AUTO
    action: ensure_policy_attached
    params:
      policy_type: SERVICE_CONTROL_POLICY
      policy_name: scp-gov-baseline
      policy_file: policies/scp-gov-baseline.json
    mitre:
      - T1666      # Modify Cloud Resource Hierarchy
      - T1562.008  # Impair Defenses: Disable or Modify Cloud Logs
      - T1078.004  # Valid Accounts: Cloud Accounts

  GOV.4:
    title: "SCP de restrição de regiões anexada"
    decision: AUTO
    action: ensure_policy_attached
    params:
      policy_type: SERVICE_CONTROL_POLICY
      policy_name: scp-gov-region-guardrail
      policy_file: policies/scp-gov-region-guardrail.json
      allowed_regions:
        - us-east-1
        - sa-east-1
    mitre:
      - T1535      # Unused/Unsupported Cloud Regions

  GOV.5:
    title: "Tag policy de padronização (Environment, Owner, CostCenter) anexada"
    decision: AUTO
    action: ensure_policy_attached
    params:
      policy_type: TAG_POLICY
      policy_name: tag-gov-required-tags
      policy_file: policies/tag-gov-required-tags.json
      enable_type_if_needed: true
    mitre: []

  GOV.6:
    title: "Contas-membro diretamente na raiz, fora de uma OU"
    decision: MANUAL
    reason: "Mover conta de OU muda as políticas herdadas; é decisão de arquitetura, não de script"
    mitre: []

  # Camada detectiva: o AWS Config precisa enxergar a organização inteira.
  # Só leitura: criar o agregador exige uma role e, de preferência, a conta Audit
  # como administradora delegada (é o que o Control Tower faz).
  GOV.7:
    title: "AWS Config agregando a organização (agregador ou administrador delegado)"
    decision: MANUAL
    reason: "Agregador organizacional fica na conta de auditoria, com role própria; configure pelo Control Tower ou pelo runbook"
    runbook: "https://docs.aws.amazon.com/config/latest/developerguide/aggregate-data.html"
    mitre:
      - T1562.008  # Impair Defenses: Disable or Modify Cloud Logs

  # Control Tower, quando existe: landing zone e controles habilitados nas OUs alvo.
  # Sem Control Tower o item fica NOT_APPLICABLE, e as SCPs do GOV.3 e GOV.4 fazem o papel preventivo.
  GOV.8:
    title: "Control Tower com controles habilitados nas OUs alvo"
    decision: MANUAL
    reason: "Registrar a OU e habilitar controles é feito pelo Control Tower (console, EnableBaseline ou EnableControl), que é o dono desses controles"
    runbook: "https://docs.aws.amazon.com/controltower/latest/controlreference/controls.html"
    mitre: []
